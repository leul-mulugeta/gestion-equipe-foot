name: Deploy client
on:
  push:
    branches: ["main"]
    paths: ["client/**"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@v9
        with:
          switches: >-
            -avzrc --delete
            --exclude=Dockerfile
          path: client/
          remote_path: ${{ secrets.ALWAYSDATA_CLIENT_PATH }}
          remote_host: ${{ secrets.ALWAYSDATA_CLIENT_SSH_HOST }}
          remote_user: ${{ secrets.ALWAYSDATA_CLIENT_SSH_USER }}
          remote_key: ${{ secrets.ALWAYSDATA_CLIENT_SSH_KEY }}
